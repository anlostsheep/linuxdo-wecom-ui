                          - generic [ref=f131e446]: 一元复始
                        - link "11 小时前" [ref=f131e449] [cursor=pointer]:
                          - /url: /t/topic/2787526?u=lostsheep
                          - generic [ref=f131e450]: 11 小时
                      - generic [ref=f131e451]:
                        - generic [ref=f131e452]:
                          - paragraph [ref=f131e453]: 8月18日，百度发布2026年第二季度财报，当晚的业绩电话会上，百度创始人李彦宏用核心篇幅谈及AI业务布局，也明确对外释放信号，要让文心大模型重新回到基础大模型的第一梯队。
                          - paragraph [ref=f131e454]:
                            - strong [ref=f131e455]: 李彦宏在会上明确判断，AI新业务已经稳固确立为百度的核心业务，接下来公司将进一步夯实技术底座，为下一阶段AI驱动的增长储备动能。
                          - paragraph [ref=f131e456]: 但转型的矛盾同样突出。传统业务的收缩速度，快于AI业务的增量填补速度。
                          - paragraph [ref=f131e457]: 二季度在线营销服务收入131亿元，同比下降19%；传统业务整体收入104亿元，同比下降23%。广告基本盘持续萎缩，AI业务尚未进入全面高增长阶段，增量暂时没能完全覆盖传统业务留下的缺口，这是百度当前AI转型最核心的现实困境。
                          - paragraph [ref=f131e458]: 作为国内最早一批投入基础大模型研发的企业，百度在文心系列上的布局已经走过数年。从早期技术积累到文心一言正式推出，再到后续多轮版本迭代，文心曾长期处在国产大模型的第一阵营。
                          - paragraph [ref=f131e459]: 但大模型赛道的迭代速度远超行业预期。基础模型技术仍在快速演进，每隔几个星期就有新的模型脱颖而出，整个领域始终高度活跃，竞争格局远未定型。在此背景下，当前的文心系列未能守住绝对的SOTA优势，在日趋激烈的模型竞赛中，行业位次出现滑落。
                          - paragraph [ref=f131e460]:
                            - strong [ref=f131e461]: 李彦宏在电话会上对此做出回应。他表示，作为最早押注基础模型的公司之一，百度在探索过程中难免出现试错，但让文心具备核心竞争力的承诺始终坚定不移。在他看来，大模型行业的长期竞争力，从来不是靠短期参数比拼，归根结底取决于持续稳定的技术投入、以应用落地为导向的产品策略，以及持之以恒的长期耐心。
                          - paragraph [ref=f131e462]: 为了推动文心加速追赶，百度近期在产品布局、组织架构和人才储备上接连出手。
                          - paragraph [ref=f131e463]: 应用端，百度正在快速整合办公场景的AI产品矩阵。6月公司推出通用型日常生产力智能体DuMate企业版，切入企业办公市场；8月完成AI办公产品线新一轮整合，形成以百度搭子、库库AI、秒哒为代表的AI办公产品阵列。
                          - paragraph [ref=f131e464]:
                            - strong [ref=f131e465]: 李彦宏明确了接下来的策略，不会盲目铺开全场景，而是聚焦百度生态内最核心的应用方向，集中资源让文心在AI搜索、数字人、秒哒等重点领域做到行业最强。与此同时，百度在近期引进顶尖人工智能人才，配合持续的研发资源投入，目标是加快文心的迭代节奏
                          - complementary [ref=f131e466]:
